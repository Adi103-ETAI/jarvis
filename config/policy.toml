# JARVIS gate policy — human-readable rules. First match wins.
# Philosophy (agreed 2026-10-24): keep the kernel's own permission asks;
# JARVIS auto-runs only clearly-benign commands and puts the human in the
# loop for everything else. Ambient speech can never mutate the machine.

version = 1

# Commands that may run WITHOUT asking the human (fully audited in the log).
[[benign.shell]]
pattern = '^\s*(echo|ls|cat|pwd|whoami|date|hostname|uname|head|tail|wc|which|file|stat|du|df)\b'
note = "read-only inspection"

[[benign.shell]]
pattern = '^\s*git (status|log|diff( --stat)?|show|branch|remote( -v)?|blame)\b'
note = "read-only git inspection"

[[benign.shell]]
pattern = '^\s*python3 -c .*(print|len|sum|min|max)\b'
note = "tiny pure-computation snippets"

# Test runs are the development loop; they exist to REPORT, not destroy.
# (The forbiddens above still veto any destructive content inside the chain.)
[[benign.shell]]
pattern = '^(cd\s+\S+\s*&&\s*)?(PYTHONPATH=\S+\s+)*(timeout\s+\d+\s+)?(PYTHONPATH=\S+\s+)?python3(3(\.\d+)?)?\s+-m\s+pytest\b'
note = "test runs"

# NEVER runnable by JARVIS, from any trust level, even after a confirm.
[[forbiddens]]
pattern = '(^|[;&|]\s*)rm\s+(-[a-zA-Z]+\s+)*-[a-zA-Z]*r[a-zA-Z]*f|(^|[;&|]\s*)rm\s+-[a-zA-Z]*f[a-zA-Z]*r'
note = "recursive/forced rm"

[[forbiddens]]
pattern = '\b(mkfs|mkfs\.\w+|shutdown|reboot|poweroff|halt|fdisk|parted|dd\b[^|;]*\bof=/dev/)\b'
note = "system-destructive commands"

[[forbiddens]]
pattern = '(^|\s)>\s*/dev/sd[a-z]|\bchmod\s+-R\s+000\s+/\b'
note = "raw device damage"

# What a mutating request does, per trust level of the prompt that caused it.
# mutating = deny | confirm | once
[trust.console]
mutating = "confirm"      # typed by you: ask before mutating (with a one-time code)

[trust.ambient]
mutating = "deny"         # overheard/fallback-parsed speech: may NEVER mutate

[trust.peer]
# Phase 8: channel peers (Telegram DMs, groups) talk to JARVIS through
# the gateway. Peer ANSWER turns are TEXT-ONLY conversation: mutating =
# "deny" and task-spawning denied below, so a chat message can never
# execute anything — OpenClaw's chat-driven tool execution is refused on
# principle (D7). Widening this (e.g. mutating = "confirm") is a
# deliberate subject edit of THIS FILE; code never widens it at runtime.
mutating = "deny"
deny_actions = ["task"]   # a peer conversation may never spawn delegates

[trust.scheduled]
mutating = "confirm"      # standing jobs still confirm; once you trust the loop, flip specific jobs

# Delegated (phase 7): a `delegate TASK` child session. The child inherits
# the SAME rules as the console minus one more: it may never spawn further
# delegates (deny_actions below — Hermes' "leaf subagent" law). Its output
# is EVIDENCE for the parent, never commands; its journal lines carry the
# parent session id.
[trust.delegated]
mutating = "confirm"
deny_actions = ["task"]   # no sub-delegation; runtime never widens this

# Learning loop (phase 7): after compaction or every N completed console
# turns, ONE background kernel turn reviews the session and drafts skill /
# memory PROPOSALS into staging. Nothing applies without you: skill
# approve NAME / fact approve ID are the only paths from staging to live
# state. enabled=false is the kill switch (Hermes' max_ticks analog).
[learning]
enabled = true
every_n_turns = 20        # 0 disables the turn trigger entirely
max_staged = 3            # pause proposing when this many await review
review_hours = 20         # at most one ritual per window

# Runtime action names (kernel 2.1.4 uses shell, NOT bash)
mutating_actions = ["shell", "edit", "write", "webfetch", "external_directory", "task"]

# Phase 5 memory — how much JARVIS may remember and inject. Facts are
# subject-written only (console); these caps bound what memory may become.
[memory]
max_facts = 512            # hard cap on stored facts (tighten-only storage)
inject_max_chars = 1200    # per-turn durable-memory prompt prefix budget
relevant_top_k = 3         # non-core facts recalled into a turn by relevance

# Phase 6 skills — procedural memory (Hermes-adapted). A skill PROPOSES a
# procedure and names the tools it INTENDS to use; Gate B still judges
# every call, so a skill can never grant what policy denies. The index
# (name + description only) rides into each turn under a char budget; the
# full body loads only on a deterministic name match or an explicit
# `skill NAME TASK`. Matching is rule-based, never a model call (D6).
[skills]
enabled = true
inject_max_chars = 900     # per-turn skill-index prompt budget
match_enabled = true       # swap the index for the full body on a name match

# Model failover (phase 5.1): when the kernel refuses a turn because the
# model is rate-limited (HTTP 429/402) or a model dies mid-turn, JARVIS
# tries the next model in this list, in order -- and the winner becomes
# the sticky default. The list is POLICY: you approve it by writing it
# here (same law as routines.toml); runtime never widens it. Fill it from
# the 'models' console command. Kernel-down (connection refused) is NOT
# failover -- no model fixes that.
[model]
failover = [
  # "opencode/qwen3-coder-free",
  # "opencode/gpt-5-nano",
]

# Phase 8 — messaging gateway (OpenClaw-adapted, docs/phase8-gateway.md).
# A channel is a trust SOURCE, never an authority: policy maps it to a
# lane, and every invalid/missing value falls back to the SAFE choice
# (lane->observe, dm->disabled, groups->disabled, relay->off). Channels
# are OFF until you edit this file — the file IS the approval (same law
# as routines.toml and the failover chain). Pairing decisions happen at
# the console ONLY (channel approve); a paired sender gains a
# conversation, never a permission.
[channels.telegram]
enabled = false            # flip to true + fill token to go live
lane = "peer"              # peer = observe/brief/answer (text-only) | observe = record-only
dm_policy = "pairing"      # pairing | allowlist | disabled (unknown senders get a code)
allow_from = []            # numeric Telegram user ids approved HERE, e.g. ["123456789"]
group_policy = "disabled"  # groups are record-only in v0; "allowlist" + ids to record
group_allow_from = []      # numeric chat ids (supergroups are negative)
require_mention = true     # groups: only mentioned messages are recorded
mention_patterns = ['\bjarvis\b']
pairing_ttl_seconds = 3600 # pairing codes expire after 1 hour (OpenClaw's rule)
max_pending_pairings = 3   # ignore extra requests while 3 await review
relay = "off"              # off | subject — code notices + routine lines to your DM
subject = ""               # YOUR numeric id (relay target); the relay is read-only
# token = ""               # or JARVIS_TELEGRAM_TOKEN env, or token_file = "/path"

[channels.whatsapp]
# Official WhatsApp Business Cloud API (phase 8.1, decision D9) -- NOT the
# Baileys/WhatsApp-Web reverse-engineered path OpenClaw uses (ToS ban risk,
# Node-only; see docs/decisions.md D9). Setup: create a Meta app with the
# WhatsApp product, copy the phone_number_id, mint a permanent access
# token, then point Meta's webhook at this host (public HTTPS; a tunnel
# like ngrok/cloudflared is fine for dev) with webhook_path below.
# COST: free on JARVIS's pattern -- answers ride Meta's free 24h service
# window (peers message first); only business-initiated TEMPLATE sends
# cost money. Keep relay = "off" here: proactive pushes outside the
# window need paid templates -- Telegram carries notices for free.
enabled = false            # flip to true + credentials to go live
lane = "peer"              # same law as Telegram: peer answers, observe records
dm_policy = "pairing"      # unknown senders get a pairing code, console approves
allow_from = []            # WhatsApp ids: country code + number, no plus, e.g. ["911234567890"]
group_policy = "disabled"  # groups are record-only in v0 (same as Telegram)
group_allow_from = []      # group jids look like "123-456@g.us"
require_mention = true
mention_patterns = ['\bjarvis\b']
relay = "off"
subject = ""               # YOUR WhatsApp id (relay target); read-only mouth
# --- whatsapp dialect (adapter options; unknown keys ride in options)
phone_number_id = ""       # Meta App > WhatsApp > API Setup (REQUIRED to start)
webhook_port = 8080        # where Meta POSTs arrive; must be publicly reachable
webhook_path = "/webhook"
webhook_verify_token = ""  # optional; derived from the access token if empty
app_secret = ""            # Meta App secret; SET IT to enforce X-Hub-Signature-256
# token = ""               # or JARVIS_WHATSAPP_TOKEN env, or token_file = "/path"

# MCP bridge (jarvis-mcp-gate): MCP tools raise no kernel permission
# requests in 2.1.4, so the bridge carries the gate itself -- with the SAME
# rules as native tools (user decision 2026-10-26). mutating_tool_matches
# names the tool-name substrings that COULD mutate; policy then judges the
# call's content: benign allowlisted commands flow free, forbidden content
# is refused inline, everything else parks for a human one-time code.
# Discovery/introspection always flow free -- JARVIS sees every tool.
[mcp]
mutating_tool_matches = [
  "execute", "shell", "replace", "insert_", "create_", "write", "delete",
  "remove", "rename", "run_", "record_release", "capture_", "submit_",
  "act_", "disable", "enable", "kill_", "patch_", "put_", "set_", "touch",
]
